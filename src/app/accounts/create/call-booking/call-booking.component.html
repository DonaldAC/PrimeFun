<div *ngIf="isLoaded">
  <div class="overlay">
    <div class="fore-ground">
      <div class="content justify-content-center">
        <img src="assets/images/logos/funda-logo-dark.svg" class="img" />
        <h2 class="mt-4 mb-0 text-primary font-weight-bold text-center">
          You meet all our minimum
        </h2>
        <h2 class="mb-2 text-primary font-weight-regular text-center">
          criteria for capital
        </h2>
        <h3 class="mb-4 sub-heading font-weight-medium  text-center description">
          Book a call with your dedicated account manager to discuss your funding
          options:
        </h3>
      </div>
      <div class="button-container">
        <button  [routerLink]="['/accounts/booking']" class="btn btn-danger font-weight-semibold btn-booking">
          Book a call
        </button>
        <button
          [routerLink]="['/accounts/login']"
          class="btn btn-danger btn-sign-in font-weight-semibold"
        >
          Sign In
        </button>
      </div>
    </div>
  </div>

</div>
