<form
  [formGroup]="formGroup"
  (ngSubmit)="submitForm()"
  [ngClass]="{ submitted: isSubmitted }"
>
  <div class="form-group mb-0">
    <div class="row justify-content-center">
      <div class="col-420px-12 col-10 col-sm-8 col-xl-7">
        <div class="input-container mb-4">
          <div class="input-wrapper draw meet position-relative">
            <label class="position-absolute input-label" for="email"
              >Email</label
            >
            <input
              type="email"
              class="form-control form-input p-4"
              formControlName="email"
            />
          </div>
          <div class="mt-2 text-danger" style="font-size: 0.625rem" *ngIf="">
            Email is a required field
          </div>
        </div>
      </div>
      <div class="col-420px-12 col-10 col-sm-8 col-xl-7">
        <div class="input-wrapper draw meet position-relative mb-2">
          <label class="position-absolute input-label" for="password"
            >Password</label
          >
          <input
            type="password"
            class="form-control form-input p-4"
            formControlName="password"
          />
        </div>
      </div>
      <div class="col-420px-12 col-10 col-sm-8 col-xl-7">
        <div class="d-flex justify-content-end mb-4">
          <a
            [routerLink]="['/accounts/reset-password/request']"
            style="text-decoration: underline; cursor: pointer"
            class="text-dark"
            >Forgot Password</a
          >
        </div>
      </div>
      <div class="col-420px-12 col-10 col-sm-8 col-xl-7 text-center">
        <button type="submit" class="btn btn-danger font-weight-semibold">
          Sign in
        </button>
      </div>
    </div>
  </div>
</form>
